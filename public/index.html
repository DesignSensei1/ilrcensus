<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ILRCensus</title>
<meta name="description" content="ILRA estate resident census and new resident registration">
<meta name="theme-color" content="#f2f5f3" id="theme-color">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
<script>
  // Apply the saved theme before first paint so the page does not flash.
  try { var t = localStorage.getItem('ilr.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/"><span class="mark" aria-hidden="true">ILR</span><span><b>ILRCensus</b><small>ILRA Estate</small></span></a>
    <div class="top-actions">
      <span id="net" class="net" hidden></span>
      <button id="theme" class="iconbtn" type="button" aria-label="Theme"></button>
      <span id="who" class="who"></span>
    </div>
  </div>
  <nav id="nav" class="nav" aria-label="Sections"></nav>
</header>
<main id="view" class="wrap" tabindex="-1"></main>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
